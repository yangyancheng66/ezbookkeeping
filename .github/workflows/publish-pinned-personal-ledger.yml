name: Publish pinned personal ledger image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: '必须等于固定发布 SHA 011c3fc45c1992d1fe0f9a0f6bc0cc79cb1001fd'
        required: true
        default: '011c3fc45c1992d1fe0f9a0f6bc0cc79cb1001fd'
        type: string

permissions:
  contents: read
  packages: write

env:
  RELEASE_SHA: 011c3fc45c1992d1fe0f9a0f6bc0cc79cb1001fd

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require the pinned release SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [ "$SOURCE_SHA" != "$RELEASE_SHA" ]; then
            echo "拒绝构建：source_sha 必须是 $RELEASE_SHA，不能构建 main 或其他提交。"
            exit 1
          fi

      - name: Checkout pinned release
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify release tree and credentials
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if git config --get-regexp '.*' | grep -E -q 'x-access-token|extraheader|AUTHORIZATION'; then
            echo "拒绝构建：checkout 中存在凭据。"
            exit 1
          fi
          python3 -c 'import json; assert json.load(open("package.json"))["version"]=="2.1.1"'
          grep -q '"title": "个人账本"' src/locales/zh_Hans.json
          grep -q 'const ApplicationName = "ezBookkeeping"' pkg/core/application.go

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push pinned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            RELEASE_BUILD=1
            BUILD_PIPELINE=1
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ env.RELEASE_SHA }}
            ${{ steps.image.outputs.name }}:2.1.1-personal-ledger
